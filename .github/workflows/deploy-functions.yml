name: Deploy da Edge Function (push)

# Publica supabase/functions/enviar-push no Supabase sempre que ela mudar (ou manualmente).
# Precisa dos secrets do GitHub: SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens) e SUPABASE_PROJECT_REF.
# Sem os secrets, um push comum só avisa e pula; ao rodar manualmente (Run workflow) ele falha com a mensagem do que falta.
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar secrets
        id: segredos
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          faltando=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF; do
            if [ -z "${!v}" ]; then faltando="$faltando $v"; fi
          done
          if [ -n "$faltando" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Secrets ausentes:$faltando"; exit 1
            fi
            echo "::notice::Deploy da função ignorado: secrets ausentes:$faltando (veja o README, seção Notificações push)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.segredos.outputs.ok == 'true'
        with:
          version: latest
      - name: Deploy enviar-push
        if: steps.segredos.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # --no-verify-jwt: a função é chamada pelo cron e protegida pelo segredo x-cron-secret
        run: supabase functions deploy enviar-push --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --no-verify-jwt --use-api
